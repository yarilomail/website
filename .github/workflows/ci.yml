name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install Dependencies
      run: npm ci --no-fund --no-audit
    - name: Test
      run: npm run -w main test
    - name: Build with VitePress
      run: npm run -w main docs:build
    - name: Check page titles
      run: node scripts/check-titles.mjs main/.vitepress/dist
    - name: Check page links end in .html
      run: node scripts/check-urls.mjs main/.vitepress/dist
    - name: Check every page has one h1
      run: node scripts/check-h1.mjs main/.vitepress/dist
