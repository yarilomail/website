name: Deploy

# Image is built on every push to main/develop (sha + latest tags).
# A NEW versioned image tag (= Chart.yaml appVersion) is pushed only when that
# version is new — i.e. bump helm/Chart.yaml to cut a new release. The deployed
# image tag defaults to Chart.AppVersion in the chart, so ArgoCD rolls out the
# new version once it is built. A GitHub release + git tag are created on main
# for each new version.

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/website

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, ""); print $2}' helm/Chart.yaml)
          RELEASE_TAG="v${APP_VERSION}"
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q "${RELEASE_TAG}"; then
            IS_RELEASE=false
          else
            IS_RELEASE=true
          fi
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- release: only on main, only when the version is new ---
      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true' && github.ref == 'refs/heads/main'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Push git tag
        if: steps.version.outputs.is_release == 'true' && github.ref == 'refs/heads/main'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md

      # Tell Bing/Yandex/Seznam which URLs changed. Only on an actual release:
      # without a chart bump nothing new reaches production, so there is
      # nothing to re-crawl. The URL list is read from the live sitemap so it
      # never goes stale as pages are added. Non-fatal — a failed ping must
      # not fail the build.
      - name: Notify IndexNow
        if: steps.version.outputs.is_release == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SITE: https://yarilomail.org
          INDEXNOW_KEY: d991637c230a415982543356a284fcdb
        run: |
          URLS=$(curl -sf --max-time 30 "${SITE}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -e 's|<loc>||g' -e 's|</loc>||g' \
            | jq -R . | jq -sc .)
          if [ -z "${URLS}" ] || [ "${URLS}" = "[]" ]; then
            echo "sitemap empty or unreachable, skipping"
            exit 0
          fi
          echo "submitting: ${URLS}"
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"yarilomail.org\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"${SITE}/${INDEXNOW_KEY}.txt\",\"urlList\":${URLS}}" \
            && echo "IndexNow notified" || echo "IndexNow ping failed (non-fatal)"

      - name: Cleanup old GHCR versions
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: website
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^v?\d+\.\d+\.\d+$'
          token: ${{ secrets.GITHUB_TOKEN }}
