name: Deps check - website

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  check:
    name: Check npm dependency updates
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Check for updates
        id: check
        run: |
          UPDATES=$(npm outdated --workspaces --include-workspace-root 2>/dev/null || true)
          if [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo "updates<<EOF"
              echo "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      # Keeps one open issue in sync: body refreshed on every run, closed once
      # nothing is outdated.
      - name: Sync dependency issue
        uses: actions/github-script@v7
        env:
          UPDATES: ${{ steps.check.outputs.updates }}
        with:
          script: |
            const title = 'npm dependency updates available';
            const updates = process.env.UPDATES || '';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'dependencies', per_page: 100,
            });
            const issue = open.find(i => i.title === title);

            if (!updates.trim()) {
              if (!issue) { core.info('Nothing outdated, no open issue'); return; }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'All npm dependencies are up to date. Closing.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed #${issue.number}`);
              return;
            }

            // One named install per package at the version its range allows
            // (Wanted), in the workspace that depends on it (no -w for the root
            // package). A Latest beyond Wanted is a new major version: listed
            // for a decision, with no command.
            const root = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name;
            const installs = [], majors = [];
            for (const l of updates.split('\n').slice(1).filter(l => l.trim())) {
              const [name, current, wanted, latest] = l.trim().split(/\s+/);
              const ws = l.trim().split(/\s+/).pop().replace(/@[^@]*$/, '');
              if (current !== wanted) installs.push(`npm install ${ws === root ? '' : `-w ${ws} `}${name}@${wanted}`);
              if (latest !== wanted) majors.push(`- ${name} ${wanted} to ${latest}`);
            }
            const checked = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = [
              'The following npm packages have newer versions available:',
              '', '```', updates, '```', '',
              ...(installs.length ? [
                'To update within the allowed ranges, install each package by name:',
                '```sh', ...installs, '```', '',
                'Not `npm update`: it ignores the root `overrides` and can take a pinned',
                'package back to an older, vulnerable version.', '',
              ] : []),
              ...(majors.length ? [
                'A new major version, outside the allowed range; needs a decision:',
                ...majors, '',
              ] : []),
              `_Last checked: ${checked} UTC_`,
            ].join('\n');

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info(`Updated #${issue.number}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title, labels: ['dependencies'], body });
              core.info(`Created #${data.number}`);
            }
