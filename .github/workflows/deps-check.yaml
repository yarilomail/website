name: Deps check — website

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  check:
    name: Check npm dependency updates
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Check for updates
        id: check
        run: |
          UPDATES=$(npm outdated --workspaces --include-workspace-root 2>/dev/null || true)
          if [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo "updates<<EOF"
              echo "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if updates available
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const updates = `${{ steps.check.outputs.updates }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });
            const alreadyOpen = existing.data.some(i => i.title === 'npm dependency updates available');
            if (alreadyOpen) {
              core.info('Issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'npm dependency updates available',
              labels: ['dependencies'],
              body: `The following npm packages have newer versions available:\n\n\`\`\`\n${updates}\n\`\`\`\n\nTo update, run:\n\`\`\`sh\nnpm update --workspaces --include-workspace-root && npm install\n\`\`\``
            });
