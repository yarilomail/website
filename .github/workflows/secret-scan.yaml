name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks CLI directly (MIT, free) instead of the marketplace
      # action, which requires a paid GITLEAKS_LICENSE for organization accounts.
      # The version is pinned with its checksum: looking up the latest release
      # on every run fails the gate whenever that lookup is refused.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/$tgz" gitleaks
          gitleaks git . --config .gitleaks.toml --redact --exit-code 1 --no-banner
