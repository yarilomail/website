server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP from Cloudflare (whitelist restricts origin to CF anyway).
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # One canonical URL per page: the home page is /, every other page ends
    # in .html. Matched on $request_uri (the client's original URI) so the
    # internal try_files rewrite below cannot loop back into this rule.
    # Absolute https targets: the origin sits behind Cloudflare and sees plain
    # HTTP, so a relative redirect would send crawlers to http:// and cost an
    # extra hop.
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 https://$host/$is_args$args;
    }

    # No =404 fallback to /404.html by name: that serves it with a 200 status,
    # so every missing URL would look like a real page to crawlers.
    # $uri/index.html, not $uri/: the latter makes nginx redirect /dir to
    # http://host/dir/ (the origin sees plain HTTP behind Cloudflare).
    location / {
        try_files $uri $uri/index.html @html;
    }

    # An extensionless URL of an existing page (the form used before pages
    # moved to .html) is sent to the .html form; anything else is missing.
    location @html {
        if (-f $document_root$uri.html) {
            return 301 https://$host$uri.html$is_args$args;
        }
        return 404;
    }

    # RFC 9116: security.txt must be text/plain with charset utf-8; nginx
    # sends bare text/plain unless told.
    location = /.well-known/security.txt {
        charset utf-8;
        charset_types text/plain;
    }

    # llms.txt is Markdown with non-ASCII punctuation: same charset rule.
    location = /llms.txt {
        charset utf-8;
        charset_types text/plain;
    }

    # Content-hashed assets: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Per-environment extras (e.g. staging X-Robots-Tag noindex) mounted here.
    # Glob include tolerates an empty/missing dir, so production needs nothing.
    include /etc/nginx/conf.d/robots/*.conf;

    error_page 404 /404.html;
    # A directory without index.html (e.g. /news/) is a missing page, not a
    # forbidden one.
    error_page 403 =404 /404.html;
}
