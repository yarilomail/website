server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP from Cloudflare (whitelist restricts origin to CF anyway).
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # One canonical URL per page: send the .html form to the clean one.
    # Matched on $request_uri (the client's original URI) so the internal
    # try_files rewrite below cannot loop back into these rules.
    # Absolute https target: the origin sits behind Cloudflare and sees plain
    # HTTP, so a relative redirect would send crawlers to http:// and cost an
    # extra hop.
    if ($request_uri ~ ^/index\.html$) {
        return 301 https://$host/;
    }
    if ($request_uri ~ ^(/.+)\.html$) {
        return 301 https://$host$1;
    }

    # VitePress cleanUrls: /page -> /page.html. The fallback must be =404, not
    # /404.html: naming a URI makes nginx serve that page with a 200 status,
    # so every missing URL would look like a real page to crawlers.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed assets: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Per-environment extras (e.g. staging X-Robots-Tag noindex) mounted here.
    # Glob include tolerates an empty/missing dir, so production needs nothing.
    include /etc/nginx/conf.d/robots/*.conf;

    error_page 404 /404.html;
}
