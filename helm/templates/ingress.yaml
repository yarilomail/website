{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "yarilomail-web.fullname" . }}
  labels:
    {{- include "yarilomail-web.labels" . | nindent 4 }}
    {{- if .Values.cloudflareWhitelist.enabled }}
    # The cluster's cf-whitelist CronJob (k8s_web) keeps the annotation current.
    seconddns.com/cloudflare-whitelist: "true"
    {{- end }}
  annotations:
    {{- if and .Values.ingress.tls .Values.ingress.certIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer }}
    {{- end }}
    {{- if .Values.cloudflareWhitelist.enabled }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.cloudflareWhitelist.ipRanges | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "yarilomail-web.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "yarilomail-web.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
