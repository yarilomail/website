image:
  repository: ghcr.io/yarilomail/website
  tag: ""            # set per-environment by CI
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "public"
  host: yarilomail.org
  tls: true
  certIssuer: letsencrypt-prod
  tlsSecretName: ""   # defaults to "<fullname>-tls"

# Restrict origin access to Cloudflare edge IPs (site is Cloudflare-proxied).
cloudflareWhitelist:
  enabled: true
  ipRanges: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

# Emit X-Robots-Tag noindex (used on staging to keep it out of search).
noindex: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
